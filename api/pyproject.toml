[project]
name = "disciplineos-api"
version = "0.1.0"
description = "DisciplineOS backend — FastAPI + SQLAlchemy 2 + PostgreSQL 16"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",    # asserts are fine in tests
    "B008",    # FastAPI Depends() in defaults
    "SIM105",  # contextlib.suppress is not always clearer
    "RUF012",
    "RUF001",  # the UI strings and docs are bilingual: Cyrillic + typographic dashes
    "RUF002",
    "RUF003",
    "UP042",   # (str, Enum) mixin is intentional: works with SQLAlchemy + JSON
    "UP046",   # explicit Generic[T] keeps pydantic v2 happy
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "E501", "ASYNC240"]  # blocking Path checks in tests are fine
"app/cli.py" = ["T201"]
"app/core/config.py" = ["S105", "S106"]  # documented, validator-guarded default
"app/services/meta_i18n.py" = ["E501"]
"app/models/__init__.py" = ["RUF022"]   # grouped by domain, not alphabetically
"app/schemas/__init__.py" = ["RUF022"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = ["alembic/versions"]
