<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DisciplineOS — нет сети</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        background: #0b1220;
        color: #e8eef7;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 22rem;
        color: #8492ab;
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 16px;
        background: #38e0c8;
        color: #080d16;
        font-size: 15px;
        font-weight: 600;
      }
      svg {
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M3 4l18 16M8.5 12.5a5 5 0 0 1 4-1.4M5 9a10 10 0 0 1 4-2.4M15.5 9.4A10 10 0 0 1 19 12" stroke-linecap="round" />
      <path d="M10.5 16.2a2.5 2.5 0 0 1 3.2.2" stroke-linecap="round" />
      <circle cx="12" cy="19.5" r=".6" fill="currentColor" />
    </svg>
    <h1>Нет подключения</h1>
    <p>
      Приложение работает офлайн: оболочка загружена из кэша, а записанные данные отправятся
      автоматически, когда появится сеть.
    </p>
    <p>Offline — your writes are queued and will sync automatically.</p>
    <button onclick="location.reload()">Повторить / Retry</button>
  </body>
</html>
