<!doctype html>
<html lang="ru" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Stage 9 (performance): on a paired device, start the reads of the first screen
      // while the app code is still downloading — the session (every screen) plus what
      // Today, Food or Plan ask for when they open. src/api/client.ts hands each response
      // to the app's first request for the same URL (unused ones are simply dropped).
      // Keep the lists in step with the screens' queries (scripts/perf/perf-run.mjs prints them).
      ;(function () {
        try {
          var token = localStorage.getItem('dsos.device_token')
          if (!token || !window.fetch) return
          // the device's local day, as lib/format today() (Intl would cost more here than the reads)
          var now = new Date()
          var day = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2)
          var screens = {
            '/today': ['/v1/nutrition/day?date=' + day, '/v1/recipes', '/v1/training/today', '/v1/health/today',
              '/v1/planner/views/today', '/v1/planner/timer', '/v1/gamification/today'],
            '/food': ['/v1/nutrition/day?date=' + day, '/v1/foods/recents', '/v1/foods/favorites', '/v1/recipes'],
            '/plan': ['/v1/planner/views/today', '/v1/planner/timer', '/v1/planner/counts'],
          }
          var path = location.pathname.replace(/\/+$/, '') || '/today'
          var early = {}
          ;['/v1/auth/session', '/v1/meta/app-config'].concat(screens[path] || []).forEach(function (url) {
            var request = fetch('/api' + url, {
              headers: { Accept: 'application/json', Authorization: 'Bearer ' + token },
              credentials: 'omit',
            })
            request.catch(function () {}) // a failure reaches the app's own request
            early['/api' + url] = request
          })
          window.__dsosEarly = early
        } catch (error) {}
      })()
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>DisciplineOS</title>
    <meta
      name="description"
      content="Личный трекер дисциплины: питание, тренировки, шаги, задачи PARA, время и геймификация."
    />

    <!-- PWA / iOS -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Stage 10: the appearance before anything paints (no flash of the wrong theme) — the
      // same rules as src/lib/appearance.ts, which applies them again once the app runs; keep
      // the two in step. The mode is in dsos.theme (stage 1), the rest in dsos.appearance.
      ;(function () {
        try {
          var root = document.documentElement
          var media = function (query) {
            return window.matchMedia ? window.matchMedia(query).matches : null
          }
          var pick = function (value, list, fallback) {
            return list.indexOf(value) >= 0 ? value : fallback
          }
          var stored = {}
          try {
            stored = JSON.parse(localStorage.getItem('dsos.appearance') || '{}') || {}
          } catch (error) {}
          var mode = pick(localStorage.getItem('dsos.theme'), ['light', 'dark', 'system'], 'dark')
          var theme = mode === 'system' ? (media('(prefers-color-scheme: dark)') === false ? 'light' : 'dark') : mode
          var skin = pick(stored.skin, ['evolution', 'stickers'], 'evolution')
          var ground = pick(stored.ground, ['lilac', 'mint', 'peach', 'lemonade'], 'lilac')
          root.setAttribute('data-theme', theme)
          root.classList.toggle('dark', theme === 'dark')
          root.setAttribute('data-skin', skin)
          root.setAttribute('data-ground', ground)
          root.setAttribute('data-tilt', stored.tilt === false ? 'off' : 'on')
          root.setAttribute('data-shadow', stored.shadow === 'soft' ? 'soft' : 'hard')
          root.setAttribute('data-text', stored.largeText === true ? 'large' : 'normal')
          root.setAttribute('data-motion', stored.reduceMotion === true || media('(prefers-reduced-motion: reduce)') ? 'reduce' : 'full')
          var grounds = { lilac: '#E8EAFB', mint: '#DBF1E5', peach: '#FBE6DC', lemonade: '#F0EFD2' }
          var color = skin === 'stickers' ? (theme === 'dark' ? '#17161F' : grounds[ground]) : theme === 'dark' ? '#0B1220' : '#F6F8FC'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', color)
        } catch (error) {}
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Discipline" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="mask-icon" href="/icons/icon-mono.svg" color="#38E0C8" />

    <!-- Avoid a white flash before the bundle paints. Stage 10: the page colour of the theme
         and mode set above; :where() keeps these rules weaker than the app's own styles. -->
    <style>
      :where(html, body) {
        margin: 0;
        background: #0b1220;
        color: #e8eef7;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      }
      :where(html[data-theme='light'], html[data-theme='light'] body) {
        background: #f6f8fc;
        color: #111a2b;
      }
      :where(html[data-skin='stickers'][data-theme='dark'], html[data-skin='stickers'][data-theme='dark'] body) {
        background: #17161f;
        color: #f5f3ff;
      }
      :where(html[data-skin='stickers'][data-theme='light'], html[data-skin='stickers'][data-theme='light'] body) {
        background: #e8eafb;
        color: #111111;
      }
      :where(html[data-skin='stickers'][data-theme='light'][data-ground='mint'], html[data-skin='stickers'][data-theme='light'][data-ground='mint'] body) {
        background: #dbf1e5;
      }
      :where(html[data-skin='stickers'][data-theme='light'][data-ground='peach'], html[data-skin='stickers'][data-theme='light'][data-ground='peach'] body) {
        background: #fbe6dc;
      }
      :where(html[data-skin='stickers'][data-theme='light'][data-ground='lemonade'], html[data-skin='stickers'][data-theme='light'][data-ground='lemonade'] body) {
        background: #f0efd2;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot span {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(56, 224, 200, 0.25);
        border-top-color: #38e0c8;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><span></span></div>
    </div>
    <noscript>
      DisciplineOS requires JavaScript. / DisciplineOS требует включённый JavaScript.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
