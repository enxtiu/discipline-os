name: ${COMPOSE_PROJECT_NAME:-disciplineos}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # IMPORTANT: pg_trgm (typo-tolerant Russian/English food search) only
      # produces trigrams for Cyrillic when the database locale is a real UTF-8
      # locale. With the C/POSIX locale it silently returns 0 for every
      # similarity() call. Keep this line (it matters only on first initdb).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsos} -d ${POSTGRES_DB:-dsos}"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Deliberately NOT published to the host. Use:
    #   docker compose exec postgres psql -U dsos -d dsos
    # (docker-compose.dev.yml publishes it for local work)

  api:
    image: ${API_IMAGE:-ghcr.io/OWNER/disciplineos-api:latest}
    build:
      context: ./api
      dockerfile: ../docker/api.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Guarantee in-network host regardless of what .env has for host-local dev
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8000/api/v1/meta/health', timeout=5).status_code == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  caddy:
    image: ${WEB_IMAGE:-ghcr.io/OWNER/disciplineos-web:latest}
    build:
      context: .
      dockerfile: docker/caddy.Dockerfile
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-prod}
    restart: unless-stopped
    env_file: [.env]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
